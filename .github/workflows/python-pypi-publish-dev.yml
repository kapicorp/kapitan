---
name: Publish Dev Pre-release to PyPI

# Publish a PEP 440 dev pre-release (e.g. 0.35.2.dev3) to PyPI on every
# merge to the default branch. This gives users an easy way to test the
# latest master without waiting for a stable release.
#
# For stable releases, see: python-pypi-publish.yml

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main

jobs:
  pypi-publish-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing (OIDC) to PyPI.
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          # Full history is required for uv-dynamic-versioning to compute the
          # distance from the latest tag (e.g. 3 commits after v0.35.1).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Build and check
        run: |
          uv build
          # Restrict to actual distributions so this stays correct if
          # non-package artifacts (SBOM, checksums) are ever added to dist/.
          uvx twine check dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Dev versions are derived from distance-from-latest-tag, so the same
          # version can be recomputed across runs (re-runs, tag moves, etc.).
          # Treat "already on PyPI" as a no-op instead of failing the workflow.
          skip-existing: true
